scan-type: source
ignore:
  # Empty by design. The grype job here runs with scan-type: source, so it scans
  # package-lock.json and never the container image. Every entry previously listed was
  # an Alpine apk finding, a Node.js binary CVE, or an npm package bundled inside the
  # Node base image - none of which a source scan can see - and each was keyed on
  # vulnerability ID with include-aliases: true and no package scoping, so it would
  # also have suppressed the same advisory in this repo's own dependency tree.
  # Verified: grype reports no findings with no ignores at all, and npm audit is clean.
  []

output:
  - table
  - json
search:
  scope: squashed
quiet: false
check-for-app-update: false
